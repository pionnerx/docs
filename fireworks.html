<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fireworks Demo</title>
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; background-color: black; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="fireworksCanvas"></canvas>
<script>
  const canvas = document.getElementById('fireworksCanvas');
  const ctx = canvas.getContext('2d');
  let cw = window.innerWidth;
  let ch = window.innerHeight;
  canvas.width = cw;
  canvas.height = ch;

  const fireworks = [];
  const particles = [];
  const colors = ['#ff4b4b', '#ffd84b', '#fff', '#4b9bff', '#4bff4b', '#ff4bff'];

  function random(min, max) { return Math.random() * (max - min) + min; }

  class Firework {
    constructor(x, y, targetX, targetY, color) {
      this.x = x; this.y = y; this.sx = x; this.sy = y;
      this.tx = targetX; this.ty = targetY;
      this.distance = Math.hypot(targetX - x, targetY - y);
      this.angle = Math.atan2(targetY - y, targetX - x);
      this.speed = 2; this.acceleration = 1.05; this.brightness = random(50, 70);
      this.targetRadius = 3; this.color = color;
    }
    update(index) {
      this.speed *= this.acceleration;
      const vx = Math.cos(this.angle) * this.speed;
      const vy = Math.sin(this.angle) * this.speed;
      this.x += vx; this.y += vy;
      if (Math.hypot(this.x - this.sx, this.y - this.sy) >= this.distance) {
        createParticles(this.tx, this.ty, this.color);
        fireworks.splice(index, 1);
      }
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.targetRadius, 0, Math.PI * 2);
      ctx.fillStyle = this.color;
      ctx.fill();
    }
  }

  class Particle {
    constructor(x, y, color) {
      this.x = x; this.y = y;
      this.angle = random(0, Math.PI * 2);
      this.speed = random(1, 10);
      this.friction = 0.95;
      this.gravity = 1;
      this.hue = random(0, 360);
      this.brightness = random(50, 80);
      this.alpha = 1;
      this.decay = random(0.015, 0.03);
      this.color = color;
    }
    update(index) {
      this.speed *= this.friction;
      this.x += Math.cos(this.angle) * this.speed;
      this.y += Math.sin(this.angle) * this.speed + this.gravity;
      this.alpha -= this.decay;
      if (this.alpha <= this.decay) {
        particles.splice(index, 1);
      }
    }
    draw() {
      ctx.globalAlpha = this.alpha;
      ctx.beginPath();
      ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
      ctx.fillStyle = this.color;
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function createParticles(x, y, color) {
    for (let i = 0; i < 50; i++) {
      particles.push(new Particle(x, y, color));
    }
  }

  function loop() {
    requestAnimationFrame(loop);
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    ctx.fillRect(0, 0, cw, ch);
    ctx.globalCompositeOperation = 'lighter';

    fireworks.forEach((firework, index) => {
      firework.draw();
      firework.update(index);
    });

    particles.forEach((particle, index) => {
      particle.draw();
      particle.update(index);
    });
  }

  function launchFirework(x, y) {
    const startX = cw / 2;
    const startY = ch;
    const color = colors[Math.floor(random(0, colors.length))];
    fireworks.push(new Firework(startX, startY, x, y, color));
  }

  canvas.addEventListener('click', e => {
    const rect = canvas.getBoundingClientRect();
    launchFirework(e.clientX - rect.left, e.clientY - rect.top);
  });

  setInterval(() => {
    launchFirework(random(0, cw), random(0, ch / 2));
  }, 800);

  window.addEventListener('resize', () => {
    cw = window.innerWidth;
    ch = window.innerHeight;
    canvas.width = cw;
    canvas.height = ch;
  });

  loop();
</script>
</body>
</html>
